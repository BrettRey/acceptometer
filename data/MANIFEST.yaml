      which yielded the numbers used for verification (312 recruited per
      task; 8 ME / 8 LS / 5 FC removed; 300 conditions sampled from LI
      2001-2010; 8 lexicalizations per condition; 148 pairwise phenomena in
      final analyses).
  - query: "GET api.github.com/repos/alexwarstadt/blimp and /contents/data and /contents/"
    where: GitHub REST API via curl
    result: >
      Repo exists (created 2019-11-29), license field null, no LICENSE file
