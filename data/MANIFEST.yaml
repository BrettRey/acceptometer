      and 6 island paradigms.
  - query: "GET raw.githubusercontent.com/alexwarstadt/blimp/master/README.md, grep -i license"
    where: curl + grep
    result: >
      FOUND license statement: "BLiMP is distributed under a CC-BY license"
      (links to CC-BY 4.0). Also documents the 67 x 1000-pair structure and
      96.4% aggregate human agreement.
  - query: "GET api.github.com/repos/alexwarstadt/blimp/commits/master (pin SHA), then raw files at that SHA"
    where: GitHub REST API + curl
    result: >
      Pinned 3e56b06fcabca9b30822fc66435fca6b1aa40bb1; downloaded
