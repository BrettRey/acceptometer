    human_data_content: >
      PARTICIPANT-LEVEL RAW DATA for all three tasks. LS (7-point Likert):
      30,400 rows = 304 participants x 100 items each, raw ratings 1-7 plus
      per-participant z-scores; 2,384 items over 298 pairwise-condition codes.
      ME (magnitude estimation): 30,400 rows, 304 participants, same items.
      FC (two-alternative forced choice): 30,700 rows, 307 participants, 300
      condition codes. Verified against the paper (p. 488 region, Section 3.2):
      312 recruited per task, 8 removed from ME, 8 from LS, 5 from FC ->
      expected 304/304/307, which is exactly what the files contain. Likert
      ratings take only the values 1-7. Practice/anchor items (presentation
      order 1-6) are excluded from the files by the authors.
    known_quirks: >
      (1) Header rows 1-5 of each results CSV are citation/usage comments;
      read with skip=5. (2) Files are not UTF-8 ("Schütze" in the header is
      legacy-encoded); read as latin-1 or mac-roman. (3) The conditions.csv
      files use CR-only (old Mac) line endings. (4) For 19 of 298 LS condition
      codes, the item-ID format in the results files does not exactly match
      the ID in SSA.Materials.xlsx (e.g. results "32.2.nunes.3a.g" vs
      materials "32.2.nunes.3a1.g"/"3a2.g"; results "32.3.Culicover.22b7.*"
      vs materials "32.3.culicover.22b.*"), so 120 of 2,384 LS items cannot
      be joined to sentence text without guessing; convert_human.py leaves
      text empty for those rather than guess.
