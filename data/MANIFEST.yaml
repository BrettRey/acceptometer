  blimp:
    paper: >
      Warstadt, Alex, Alicia Parrish, Haokun Liu, Anhad Mohananey, Wei Peng,
      Sheng-Fu Wang & Samuel R. Bowman (2020). "BLiMP: The Benchmark of
      Linguistic Minimal Pairs for English." TACL 8: 377-392.
    repo: https://github.com/alexwarstadt/blimp
    repo_created: "2019-11-29"
    commit_pinned: 3e56b06fcabca9b30822fc66435fca6b1aa40bb1
    license: >
      CC-BY. The repo README states: "BLiMP is distributed under a CC-BY
      license", linking to https://creativecommons.org/licenses/by/4.0/.
      (GitHub's API license field is null because there is no LICENSE file;
      the README statement is the source's own declaration.)
    contamination_caveat: >
      BLiMP has been public on GitHub since 2019-11-29 (paper published 2020)
      and is mirrored widely (Hugging Face datasets, EleutherAI lm-eval
      harness, many forks). It is therefore CONTAMINATION-SUSPECT for any
      modern LLM: the test sentences are almost certainly in the pretraining
      data of models trained on post-2020 web scrapes, and published
      benchmark results on BLiMP circulate with the labels attached. Treat
      LLM accuracy on these paradigms as an upper bound inflated by possible
      memorization, not as a clean generalization measure.
    human_data_note: >
      These two files contain NO human ratings; the good/bad labels are
      grammar-generated. (Aggregate human agreement with BLiMP labels is
      96.4% per the README; the repo's raw_results/ holds human validation
      responses, not downloaded here.)
    files:
      - path: data/raw/blimp/regular_plural_subject_verb_agreement_1.jsonl
        url: https://raw.githubusercontent.com/alexwarstadt/blimp/3e56b06fcabca9b30822fc66435fca6b1aa40bb1/data/regular_plural_subject_verb_agreement_1.jsonl
        access_date: 2026-08-27
        sha256: 1a18d94062c8e792c0a200a3b00dff0e051a92bb084c05e9b5e5c73bee32a620
        license: CC-BY (per repo README)
        description: >
          Agreement paradigm: 1,000 minimal pairs, field "morphology",
          linguistics_term "subject_verb_agreement" (e.g. "Paula references
          Robert." / "Paula reference Robert.").
        may_be_used_for: >
          Minimal-pair benchmark sample (any use with attribution, per
          CC-BY), subject to the contamination caveat above.
      - path: data/raw/blimp/wh_island.jsonl
        url: https://raw.githubusercontent.com/alexwarstadt/blimp/3e56b06fcabca9b30822fc66435fca6b1aa40bb1/data/wh_island.jsonl
        access_date: 2026-08-27
        sha256: 77824ca8c0008fb7a204e785ca2dcee1b2803f666bb545bd95cb8a51e04f1a4c
        license: CC-BY (per repo README)
        description: >
          Island paradigm: 1,000 minimal pairs, field "syntax",
