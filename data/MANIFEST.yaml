derived_files:
  - path: data/human_ratings.csv
    produced_by: data/convert_human.py
    source: data/raw/sprouse-li/SSA.data/LS experiment/LI.ls.results.csv (+ text join from SSA.Materials.xlsx, MORCELA CSV fallback)
    description: >
      Long-format participant-level 7-point Likert ratings: one row per
      (participant, item) judgment. 30,338 rows (62 source rows with a blank
      judgment dropped), 304 participants, 2,384 items, 298 constructions.
      construction = the source's pairwise condition code; no labels were
      invented. text is blank for 120 items whose results-file ID matches
      neither text source (see known_quirks). Inherits the sprouse-li usage
      terms (verification use; contact Sprouse for novel research).

search_log:
  # Every query run during acquisition, where it was run, and what it returned.
  - query: "MORCELA Tjuatja Linzen acceptability judgment GitHub code data release"
    where: WebSearch
    result: >
      FOUND. Top results included https://github.com/lindiatjuatja/morcela
      (the code/data release), the ACL Anthology page
      (aclanthology.org/2025.naacl-long.109/), and arXiv:2411.02528.
  - query: "GET api.github.com/repos/lindiatjuatja/morcela and /git/trees/main?recursive=1"
    where: GitHub REST API via curl
    result: >
      Repo metadata (license: null) and full file tree; the only data file is
      data/linguistic_inquiry_data.csv (171,312 bytes) plus
      pile_unigram_logprobs.json and src/ scripts. No LICENSE file, no
      per-participant human data.
  - query: "GET raw.githubusercontent.com/lindiatjuatja/morcela/main/README.md"
    where: curl
    result: >
      README confirms the human materials are "from the Linguistic Inquiry
      data collected by Sprouse et al. (2013)"; no license statement.
  - query: "Sprouse Schütze Almeida 2013 Linguistic Inquiry judgment data download site \"jonsprouse.com\" OR OSF materials data"
    where: WebSearch
    result: >
      FOUND. Results included https://www.jonsprouse.com/research.html (papers
      page with data links) and the paper PDF at
      jonsprouse.com/papers/Sprouse%20et%20al.%202013.pdf. No OSF deposit for
      this dataset surfaced in the results; the author-site copy was used.
  - query: "GET https://www.jonsprouse.com/research.html, grep hrefs for data|material|2013|zip|osf"
    where: curl + grep
    result: >
      FOUND direct links data/Lingua2013/SSA.data.zip and
      data/Lingua2013/SSA.Materials.xlsx (also data links for other Sprouse
      papers, not downloaded).
  - query: "WebFetch https://www.jonsprouse.com/papers/Sprouse%20et%20al.%202013.pdf (participant counts)"
    where: WebFetch
    result: >
      PARTIAL FAILURE: fetch returned raw PDF binary the summarizer could not
